<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#171310">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>The Classical Journey</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#171310; --panel:#1e1915; --panel2:#251f19; --ink:#ece4d4; --mut:#a89a86;
  --gold:#c9a233; --line:#332a22; --line2:#3a3128; --ground:#100e0c; --shadow:rgba(0,0,0,.5);
  --ok:#8fae72; --star:#d4af4e; --blue:#8fb3d1; --red:#c05b5b;
}
*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Georgia,'Palatino Linotype',Palatino,serif;-webkit-text-size-adjust:100%}
body.playing main{padding-bottom:230px}
a{color:var(--ink)}
a:hover{color:var(--gold)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ui{font-family:'Segoe UI',system-ui,sans-serif}
.disp{font-family:'Bodoni MT',Didot,'Playfair Display',Georgia,serif;font-weight:500}
.lbl{font-family:'Segoe UI',system-ui,sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}

header.top{position:sticky;top:0;z-index:20;background:rgba(23,19,16,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:.55rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{font-family:'Bodoni MT',Didot,'Playfair Display',Georgia,serif;font-size:1.3rem;color:var(--ink);text-decoration:none;letter-spacing:.01em}
.brand:hover{color:var(--gold)}
nav.main{display:flex;gap:.85rem;margin-left:auto;align-items:center;flex-wrap:wrap}
nav.main a{font-family:'Segoe UI',system-ui,sans-serif;font-size:.82rem;font-weight:500;color:var(--mut);text-decoration:none;padding-bottom:2px}
nav.main a.on{color:var(--ink);border-bottom:2px solid var(--gold)}
#sync{font-family:'Segoe UI',system-ui,sans-serif;font-size:.7rem;color:var(--mut);border:1px solid var(--line2);border-radius:99px;padding:.15rem .6rem;white-space:nowrap;cursor:pointer}
#sync.busy{color:var(--gold);border-color:var(--gold)}
#sync.err{color:var(--red);border-color:var(--red)}

main{max-width:1180px;margin:0 auto;padding:1rem 1rem 4rem}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
.hero{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;margin:.6rem 0 .4rem}
.hero h1{font-family:'Bodoni MT',Didot,'Playfair Display',Georgia,serif;font-weight:500;font-size:clamp(1.7rem,4.5vw,2.6rem);margin:0;text-wrap:balance}
.hero .sub{color:var(--mut);font-style:italic}
.tools{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.8rem 0;position:sticky;top:3.1rem;z-index:15;background:var(--bg);padding:.45rem 0;border-bottom:1px solid var(--line)}
.tools input[type=search],.tbar input[type=search]{font:inherit;font-family:'Segoe UI',system-ui,sans-serif;font-size:.85rem;background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:99px;padding:.35rem .8rem;min-width:9rem;flex:1 1 9rem;max-width:18rem}
.chip{font-family:'Segoe UI',system-ui,sans-serif;font-size:.74rem;font-weight:500;border:1px solid var(--line2);border-radius:99px;padding:.22rem .7rem;color:var(--mut);background:var(--panel);text-decoration:none;display:inline-flex;align-items:center;gap:.35rem}
.chip:hover{border-color:var(--gold);color:var(--ink)}
.chip.on{color:var(--bg);background:var(--gold);border-color:var(--gold)}
select.chip{appearance:auto;cursor:pointer;color:var(--ink)}
.gbtn{background:var(--gold);color:#1a1508;border-radius:99px;font:600 .82rem 'Segoe UI',system-ui,sans-serif;padding:.45rem 1rem}
.gbtn:hover{filter:brightness(1.1)}
.obtn{border:1px solid var(--line2);border-radius:99px;font:.78rem 'Segoe UI',system-ui,sans-serif;padding:.35rem .85rem;color:var(--ink);background:var(--panel);text-decoration:none;display:inline-flex;align-items:center;gap:.4rem}
.obtn:hover{border-color:var(--gold)}
.obtn.danger:hover{border-color:var(--red);color:var(--red)}
.sigdots{color:var(--star);font-size:.62em;letter-spacing:.1em;vertical-align:.12em}
.badge{margin-left:auto;font-size:.75rem;color:var(--gold);white-space:nowrap}
.badge .st{color:var(--star)}
.empty{color:var(--mut);font-style:italic;margin:2rem 0;text-align:center;grid-column:1/-1}

/* ---- journey ---- */
.howto{color:var(--mut);font-size:.95rem;max-width:64ch;border-left:2px solid var(--line2);padding-left:14px;margin:.4rem 0 1rem}
.howto b{color:var(--ink)}
#jbar{position:sticky;top:3.1rem;z-index:15;background:rgba(23,19,16,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -1rem;padding:0 1rem}
.pfill{height:3px;background:var(--line);border-radius:2px;margin:8px 0 6px;overflow:hidden}
.pfill i{display:block;height:100%;background:var(--gold);transition:width .4s}
#jstats{font:12px 'Segoe UI',system-ui,sans-serif;color:var(--mut);letter-spacing:.03em;margin-bottom:6px}
#jstats b{color:var(--ink)}
#eranav{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
#eranav::-webkit-scrollbar{display:none}
#eranav .chip{flex:none}
#eranav .chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dc)}
#eranav .chip b{color:var(--ink);font-weight:600}
.era{margin-top:60px}
.era-mark{font-family:'Bodoni MT',Didot,'Playfair Display',Georgia,serif;font-size:clamp(64px,12vw,120px);line-height:.9;color:var(--ac);opacity:.16;margin:0 0 -16px -4px;user-select:none}
.era-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.era-head h2{font-family:'Bodoni MT',Didot,'Playfair Display',Georgia,serif;font-weight:500;font-size:clamp(28px,4.5vw,38px);margin:0;color:var(--ac)}
.era-years{font:600 12px 'Segoe UI',system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.era-prog{width:120px;height:5px;background:var(--line);border-radius:3px;overflow:hidden;align-self:center}
.era-prog i{display:block;height:100%;background:var(--ac)}
.ep-txt{font:11px 'Segoe UI',system-ui,sans-serif;color:var(--mut)}
.era-intro{color:var(--mut);font-size:15.5px;max-width:66ch;border-left:2px solid var(--ac);padding-left:16px;margin:16px 0 6px}
.lessons{margin-top:16px}
.lesson{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;padding:2px 16px 8px;margin:10px 0}
.lesson summary{cursor:pointer;font:600 15px 'Segoe UI',system-ui,sans-serif;color:var(--gold);padding:10px 0}
.lesson summary .lb{color:var(--mut);font-weight:400;letter-spacing:.12em;text-transform:uppercase;font-size:11px;margin-right:8px}
.lesson.done summary::after{content:" ✓";color:var(--gold)}
.lesson p{margin:4px 0 12px;font-size:15px}
.l-hear{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.l-hear a{font:13px 'Segoe UI',system-ui,sans-serif;color:var(--gold);text-decoration:none;border:1px solid var(--line2);border-radius:999px;padding:4px 11px}
.l-hear a:hover{border-color:var(--gold)}
.composers{border-left:1px solid var(--line);padding-left:26px;display:flex;flex-direction:column;gap:24px;margin-top:24px}
.comp{position:relative}
.comp::before{content:"";position:absolute;left:-31px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--ac)}
.comp.done::before{background:var(--gold);box-shadow:0 0 0 3px rgba(201,162,51,.25)}
.c-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.c-num{font:600 11px 'Segoe UI',system-ui,sans-serif;color:var(--mut);letter-spacing:.08em}
.c-head h3{font-family:'Bodoni MT',Didot,'Playfair Display',Georgia,serif;font-weight:500;font-size:23px;margin:0}
.c-head h3 a{text-decoration:none}
.comp.done h3::after{content:" ✓";color:var(--gold);font-size:16px}
.c-meta{font:13px 'Segoe UI',system-ui,sans-serif;color:var(--mut)}
.radio{border:1px solid var(--line2);border-radius:999px;color:var(--mut);font:11px 'Segoe UI',system-ui,sans-serif;padding:3px 10px;margin-left:auto}
.radio:hover{border-color:var(--ac);color:var(--ink)}
.c-bio{margin:6px 0 0;font-size:15px}
.c-works{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.comp:not(.expanded) .c-works .work:nth-child(n+7){display:none}
.work{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:999px;background:var(--panel);font:13.5px 'Segoe UI',system-ui,sans-serif;max-width:100%}
.work .pl{padding:5px 6px 5px 12px;color:var(--mut);font-size:11px}
.work .pl:hover{color:var(--gold)}
.work a{padding:5px 12px 5px 2px;text-decoration:none;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.work .mk{color:var(--gold);margin-right:6px;font-size:11px}
.work.h1{border-color:var(--ac)}
.work.h3{border-color:var(--star)}
.work:hover{border-color:var(--gold)}
.more{border:1px dashed var(--line2);border-radius:999px;color:var(--mut);font:12px 'Segoe UI',system-ui,sans-serif;padding:5px 13px}
.more:hover{border-color:var(--ac);color:var(--ink)}
.flash{animation:flash 1.6s}
@keyframes flash{0%,60%{background:rgba(201,162,51,.14);border-radius:8px}100%{background:none}}

/* ---- catalog cards ---- */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.7rem;margin-top:1rem}
.gh{grid-column:1/-1;margin:1.4rem 0 .3rem;display:flex;align-items:baseline;gap:.8rem;border-bottom:1px solid var(--line);padding-bottom:.3rem}
.gh h2{font-family:'Bodoni MT',Didot,'Playfair Display',Georgia,serif;font-weight:500;font-size:1.3rem;margin:0}
.gh .range{color:var(--mut);font-size:.85rem;font-style:italic}
.gh .cnt{margin-left:auto;font-family:'Segoe UI',system-ui,sans-serif;font-size:.75rem;color:var(--mut);font-variant-numeric:tabular-nums}
.card{display:block;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ec,var(--line2));border-radius:6px;padding:.6rem .75rem;color:var(--ink);text-decoration:none;box-shadow:0 1px 3px var(--shadow)}
.card:hover{border-color:var(--gold);color:var(--ink)}
.card .t{font-family:'Bodoni MT',Didot,'Playfair Display',Georgia,serif;font-style:italic;font-size:1.02rem;line-height:1.25}
.card .a{font-family:'Segoe UI',system-ui,sans-serif;font-size:.72rem;color:var(--mut);margin-top:.3rem;display:flex;gap:.4rem;align-items:center}
.card.thin{opacity:.7}
.card .g{font-family:'Segoe UI',system-ui,sans-serif;font-size:.68rem;color:var(--mut);margin-top:.15rem;letter-spacing:.06em;text-transform:uppercase}

/* ---- work page ---- */
.wall{max-width:72ch;margin:.6rem auto 1.2rem}
.wall .cline{font-family:'Segoe UI',system-ui,sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.wall .cline a{text-decoration:none;color:var(--gold)}
.wall h1{font-family:'Bodoni MT',Didot,'Playfair Display',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(1.6rem,4.5vw,2.4rem);margin:.15rem 0 .3rem;text-wrap:balance}
.wall .meta{color:var(--mut);font-size:.92rem}
.wall .meta span{white-space:nowrap}
.wall .meta span+span::before{content:" · "}
.sigline{margin:.7rem 0 .1rem;font-size:.9rem;color:var(--mut)}
.sigline b{color:var(--gold);font-weight:700;letter-spacing:.04em}
.taxo{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0 0}
.listen{background:var(--panel2);border:1px solid var(--gold);border-radius:10px;padding:.8rem .9rem;margin:1rem 0}
.listen .row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.listen .note{font-family:'Segoe UI',system-ui,sans-serif;font-size:.72rem;color:var(--mut);margin-top:.5rem}
.tracker{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.8rem .9rem;margin:1rem 0;display:flex;flex-direction:column;gap:.7rem}
.seg{display:flex;gap:.35rem;flex-wrap:wrap}
.seg button{font-family:'Segoe UI',system-ui,sans-serif;font-size:.78rem;font-weight:500;border:1px solid var(--line2);border-radius:99px;padding:.28rem .8rem;color:var(--mut)}
.seg button.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.stars{display:flex;gap:.15rem;font-size:1.35rem;line-height:1}
.stars button{color:var(--line2)}
.stars button.on{color:var(--star)}
.tracker textarea{font:inherit;font-size:.92rem;background:var(--bg);color:var(--ink);border:1px solid var(--line2);border-radius:6px;padding:.5rem .6rem;min-height:3.2rem;resize:vertical;width:100%}
.tracker .row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.tracker .facts{font-family:'Segoe UI',system-ui,sans-serif;font-size:.72rem;color:var(--mut)}
.section{max-width:72ch;margin:1.4rem auto}
.section h3{font-family:'Segoe UI',system-ui,sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 .3rem;border-bottom:1px solid var(--line);padding-bottom:.25rem}
.section p{margin:.4rem 0}
.xlinks{max-width:72ch;margin:1.6rem auto}
.xgroup{margin:.9rem 0}
.xgroup .lbl{display:block;margin-bottom:.4rem}
.xrow{display:flex;gap:.6rem;flex-wrap:wrap}
.xchip{display:flex;flex-direction:column;border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:.35rem .65rem;color:var(--ink);max-width:100%;text-decoration:none;border-left:3px solid var(--ec,var(--line2))}
.xchip:hover{border-color:var(--gold);color:var(--ink)}
.xchip .xt{font-family:'Bodoni MT',Didot,'Playfair Display',Georgia,serif;font-style:italic;font-size:.9rem;line-height:1.2}
.xchip .xa{font-family:'Segoe UI',system-ui,sans-serif;font-size:.68rem;color:var(--mut)}
.pn{display:flex;justify-content:space-between;gap:1rem;max-width:72ch;margin:2rem auto 1rem;border-top:1px solid var(--line);padding-top:.8rem}
.pn a{font-family:'Segoe UI',system-ui,sans-serif;font-size:.78rem;color:var(--mut);max-width:45%;text-decoration:none}
.pn a b{display:block;font-family:'Bodoni MT',Didot,'Playfair Display',Georgia,serif;font-style:italic;font-weight:400;font-size:.95rem;color:var(--ink)}
.pn a.next{text-align:right}
.thinnote{max-width:72ch;margin:1rem auto;color:var(--mut);font-style:italic;border-left:2px solid var(--line2);padding-left:1rem}

/* ---- composers ---- */
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.8rem;margin-top:1rem}
.acard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ec,var(--line2));border-radius:6px;padding:.8rem .9rem;color:var(--ink);text-decoration:none}
.acard:hover{border-color:var(--gold);color:var(--ink)}
.acard .an{font-family:'Bodoni MT',Didot,'Playfair Display',Georgia,serif;font-weight:500;font-size:1.1rem}
.acard .al{font-family:'Segoe UI',system-ui,sans-serif;font-size:.72rem;color:var(--mut);margin-top:.1rem}
.acard .aw{font-family:'Segoe UI',system-ui,sans-serif;font-size:.72rem;color:var(--gold);margin-top:.4rem;font-variant-numeric:tabular-nums}
.abio{max-width:72ch;margin:.6rem 0 1rem;font-size:1.02rem}

/* ---- progress ---- */
.prog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.4rem;margin-top:1rem}
.pblock h3{font-family:'Bodoni MT',Didot,'Playfair Display',Georgia,serif;font-weight:500;font-size:1.2rem;margin:0 0 .6rem;border-bottom:1px solid var(--line);padding-bottom:.3rem}
.prow{margin:.55rem 0}
.prow .pt{display:flex;justify-content:space-between;font-family:'Segoe UI',system-ui,sans-serif;font-size:.8rem;margin-bottom:.2rem}
.prow .pt .n{font-variant-numeric:tabular-nums;color:var(--mut)}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--ec,var(--gold))}
.bar i.deep{background:var(--star)}
.bignums{display:flex;gap:1.6rem;flex-wrap:wrap;margin:1rem 0}
.bignums div b{display:block;font-family:'Bodoni MT',Didot,'Playfair Display',Georgia,serif;font-size:2rem;font-weight:500;font-variant-numeric:tabular-nums}
.bignums div span{font-family:'Segoe UI',system-ui,sans-serif;font-size:.72rem;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.legend{font-family:'Segoe UI',system-ui,sans-serif;font-size:.72rem;color:var(--mut);margin-top:.8rem}
.legend i{display:inline-block;width:.7rem;height:.7rem;border-radius:2px;vertical-align:-1px;margin-right:.3rem}
.hist{margin:.3rem 0;padding-left:1.2rem;font-size:.92rem}
.hist li{margin:.15rem 0}
.hist a{text-decoration:none}
.prose{max-width:38rem}
.prose h3{font-family:'Bodoni MT',Didot,'Playfair Display',Georgia,serif;font-weight:500;font-size:1.1rem;margin:1.6rem 0 .4rem}
.prose p{margin:.5rem 0}
footer{color:var(--mut);font-size:.8rem;text-align:center;padding:2rem 1rem;font-style:italic}
footer a{color:var(--mut)}

/* ---- dialog ---- */
#dlg{position:fixed;inset:0;z-index:60;background:rgba(10,8,6,.6);display:flex;align-items:center;justify-content:center;padding:1rem}
.sd-card{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:10px;max-width:32rem;width:100%;padding:1.1rem 1.2rem;box-shadow:0 12px 40px var(--shadow);max-height:90vh;overflow:auto}
.sd-card h3{font-family:'Bodoni MT',Didot,'Playfair Display',Georgia,serif;font-weight:500;margin:0 0 .5rem}
.sd-card h4{font-family:'Segoe UI',system-ui,sans-serif;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:1rem 0 .3rem}
.sd-p{font-size:.85rem;color:var(--mut);margin:.4rem 0}
.sd-p b{color:var(--ink)}
.sd-card input[type=text],.sd-card input[type=password]{font:inherit;font-size:.85rem;width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line2);border-radius:6px;padding:.4rem .6rem;margin:.15rem 0 .6rem}
.sd-row{display:flex;gap:.4rem;flex-wrap:wrap;margin:.4rem 0 .6rem}

/* ---- table ---- */
.tbar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.9rem 0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table.grid{border-collapse:collapse;width:100%;font-family:'Segoe UI',system-ui,sans-serif;font-size:.82rem}
table.grid th{position:sticky;top:0;z-index:2;background:var(--panel2);text-align:left;padding:.5rem .6rem;font-weight:700;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);white-space:nowrap;cursor:pointer;border-bottom:1px solid var(--line)}
table.grid th:hover{color:var(--ink)}
table.grid th .ar{opacity:.5;font-size:.7em}
table.grid td{padding:.42rem .6rem;border-bottom:1px solid var(--line);vertical-align:top;max-width:15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover{background:var(--panel2)}
table.grid td.ti{font-family:Georgia,serif;font-size:.95rem;min-width:11rem;max-width:22rem}
table.grid td.nw{white-space:nowrap;color:var(--mut)}
.mk2{display:inline-block;width:1.1rem;color:var(--gold)}
.mk2.love{color:var(--star)}
.tcount{font-family:'Segoe UI',system-ui,sans-serif;font-size:.75rem;color:var(--mut);margin:.5rem 0}
#more{display:block;width:100%;padding:.8rem;font-family:'Segoe UI',system-ui,sans-serif;font-size:.8rem;color:var(--mut);border-top:1px solid var(--line)}

/* ---- constellation ---- */
#treewrap{position:relative;margin:0 -1rem -4rem;height:calc(100vh - 3.4rem);min-height:26rem;background:var(--ground);overflow:hidden;touch-action:none}
#tree{display:block;width:100%;height:100%;cursor:grab}
#tree.drag{cursor:grabbing}
.tctl{position:absolute;top:.7rem;left:.7rem;right:.7rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;pointer-events:none;z-index:3}
.tctl>*{pointer-events:auto}
.tctl input[type=search]{font:inherit;font-family:'Segoe UI',system-ui,sans-serif;font-size:.8rem;padding:.35rem .7rem;border:1px solid var(--line2);border-radius:99px;background:var(--panel);color:var(--ink);width:12rem;box-shadow:0 2px 8px var(--shadow)}
.tkey{position:absolute;bottom:.7rem;left:.7rem;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:.5rem .7rem;font-family:'Segoe UI',system-ui,sans-serif;font-size:.7rem;color:var(--mut);line-height:1.7;box-shadow:0 2px 8px var(--shadow);z-index:3;max-width:min(20rem,60vw)}
.tkey b{color:var(--ink)}

<script>
"use strict";
const DB = window.DBJSON || JSON.parse(document.getElementById("db").textContent);
const ERAS = DB.eras;                       // {id,name,years,mark,color,intro}
const ERA = {}; ERAS.forEach(e => ERA[e.id] = e);
const TRADITIONS = {classical:"Classical",jazz:"Jazz","blues & gospel":"Blues & gospel",folk:"Folk",country:"Country","rock":"Rock",pop:"Pop","soul & funk":"Soul & funk","hip-hop":"Hip-hop",electronic:"Electronic",global:"Global traditions","screen & stage":"Screen & stage"};
const GENRES = {symphony:"Symphony",orchestral:"Orchestral",concerto:"Concerto",chamber:"Chamber & solo",keyboard:"Keyboard",opera:"Opera",stage:"Ballet & stage",choral:"Choral & sacred",song:"Song",experimental:"Experimental",album:"Album",track:"Track"};
const SIGL = {3:"Landmark",2:"Major work",1:"Notable"};
const SIGC = {3:"Landmark composer",2:"Major composer",1:"Notable composer"};
const dots = n => "◆".repeat(n||0);
const STATUS = ["Not heard","Heard","Studied","Loved"];
const MARKS = ["","✓","◆","♥"];
const byId = {}; DB.works.forEach(w => byId[w.id] = w);
const comp = {}; DB.composers.forEach(c => comp[c.id] = c);
const chrono = DB.works.slice().sort((a,b) => a.sortYear - b.sortYear || a.title.localeCompare(b.title));
const compWorks = {}; chrono.forEach(w => { if(w.composer){ (compWorks[w.composer] = compWorks[w.composer] || []).push(w); } });
DB.works.forEach(w => { if(!w.tradition) w.tradition = "classical"; });
const spine = {};   // the Journey is the classical spine — other traditions live in Works, Table and the Constellation
chrono.forEach(w => { if(w.tradition==="classical" && w.composer){ (spine[w.composer] = spine[w.composer] || []).push(w); } });
const spineComposers = DB.composers.filter(c => (spine[c.id]||[]).length);
const journey = spineComposers.flatMap(c => spine[c.id] || []);   // composer by birth, works by date
DB.works.forEach(w => { w.links = w.links || {}; ["pre","succ","sim","con"].forEach(k => w.links[k] = (w.links[k]||[]).filter(id => byId[id] && id !== w.id)); });
DB.works.forEach(w => {   // mirror the link graph
  w.links.pre.forEach(id => { const o = byId[id]; if(!o.links.succ.includes(w.id)) o.links.succ.push(w.id); });
  w.links.succ.forEach(id => { const o = byId[id]; if(!o.links.pre.includes(w.id)) o.links.pre.push(w.id); });
  w.links.sim.forEach(id => { const o = byId[id]; if(!o.links.sim.includes(w.id)) o.links.sim.push(w.id); });
  w.links.con.forEach(id => { const o = byId[id]; if(!o.links.con.includes(w.id)) o.links.con.push(w.id); });
});
const ARTIFACT = !!window.claude || /claude\.ai|claudeusercontent/.test(location.hostname);
const SITE = !ARTIFACT;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const clean = s => norm(s).replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
const cname = w => w.composer && comp[w.composer] ? comp[w.composer].name : (w.culture || "");
const lastName = c => c.name.split(" ").pop();
const fmt = t => { t = Math.max(0, t|0); return (t/60|0) + ":" + String(t%60).padStart(2,"0"); };
const fmtH = s => { const h = s/3600|0, m = (s%3600)/60|0; return h ? h+"h "+m+"m" : m+"m "+(s%60|0)+"s"; };
const enc = encodeURIComponent;
const q = w => cname(w) + " " + w.title;
const LINKS = w => [
  ["YouTube", "https://www.youtube.com/results?search_query=" + enc(q(w))],
  ["Spotify", "https://open.spotify.com/search/" + enc(q(w))],
  ["Apple Music", "https://music.apple.com/search?term=" + enc(q(w))],
  ["Internet Archive", "https://archive.org/search?query=" + enc(q(w)) + "&and%5B%5D=mediatype%3A%22audio%22"],
  ["Score (IMSLP)", "https://imslp.org/index.php?search=" + enc(q(w))],
  ["Wikipedia", "https://en.wikipedia.org/w/index.php?search=" + enc(w.wiki || q(w)) + "&go=Go"]
];

/* ---------- state ---------- */
const SK = "cj-state";
function fromV2(o){   // the pre-catalog progress shape: heard keyed by "Composer Name|Title"
  const r = {works:{}, lessons:o.lessons||{}, sec:o.sec||0, log:[]};
  for(const [k,ts] of Object.entries(o.heard||{})){ const id = DB.legacy[k]; if(!id) continue; r.works[id] = {s:1,r:0,n:"",h:ts||0,p:(o.plays||{})[k]||0}; }
  for(const e of o.log||[]){ const id = DB.legacy[e.id]; if(id) r.log.push({id, ts:e.ts}); }
  return r;
}
function mergeInto(dst, src){   // union: never loses a mark
  for(const [id,x] of Object.entries(src.works||{})){
    if(!byId[id]) continue;
    const c = dst.works[id] || {s:0,r:0,n:"",h:0,p:0};
    c.s = Math.max(c.s||0, x.s||0); c.r = Math.max(c.r||0, x.r||0);
    if(!c.n && x.n) c.n = x.n;
    c.h = (c.h && x.h) ? Math.min(c.h, x.h) : (c.h || x.h || 0);
    c.p = Math.max(c.p||0, x.p||0);
    dst.works[id] = c;
  }
  for(const [k,v] of Object.entries(src.lessons||{})) if(!(k in dst.lessons)) dst.lessons[k] = v;
  dst.sec = Math.max(dst.sec||0, src.sec||0);
  const seen = new Set(dst.log.map(e => e.id+e.ts));
  for(const e of src.log||[]) if(e && e.id && byId[e.id] && !seen.has(e.id+e.ts)) dst.log.push(e);
  dst.log.sort((a,b) => a.ts-b.ts); dst.log = dst.log.slice(-400);
}
let ST = null;
try{ ST = JSON.parse(localStorage.getItem(SK)||"null"); }catch(e){}
if(!ST || ST.v !== 3){
  ST = {v:3, updated:0, works:{}, lessons:{}, sec:0, log:[]};
  try{ const o = JSON.parse(localStorage.getItem("cm.v2")||"null"); if(o){ mergeInto(ST, fromV2(o)); ST.updated = Date.now(); } }catch(e){}
  try{ const h = JSON.parse(localStorage.getItem("cm.heard")||"[]"); const l = JSON.parse(localStorage.getItem("cm.lessons")||"[]");
    if(h.length || l.length){ const o = {heard:{}, lessons:{}}; h.forEach(k => o.heard[k] = 0); l.forEach(t => o.lessons[t] = 0); mergeInto(ST, fromV2(o)); ST.updated = Date.now(); } }catch(e){}
  try{ localStorage.setItem(SK, JSON.stringify(ST)); }catch(e){}
}
function rec(id){ return ST.works[id] || {s:0,r:0,n:"",h:0,p:0}; }
function save(){ ST.updated = Date.now(); try{ localStorage.setItem(SK, JSON.stringify(ST)); }catch(e){} queueSync(); bkQueue(); }
function setRec(id, patch){
  const r = Object.assign({s:0,r:0,n:"",h:0,p:0}, ST.works[id], patch);
  if(r.s>0 && !r.h) r.h = Date.now();
  if(r.s===0 && r.r===0 && !r.n && !r.p) delete ST.works[id]; else ST.works[id] = r;
  save();
}
function markHeard(id){   // a play or an outbound listen click: at least "Heard", one more play, a log line
  const r = rec(id);
  ST.log.push({id, ts:Date.now()}); if(ST.log.length>400) ST.log = ST.log.slice(-400);
  setRec(id, {s:Math.max(r.s,1), p:(r.p||0)+1, h:r.h||Date.now()});
  portalActivity(byId[id]);
}
// The maker's app portal keeps a character sheet from what its apps report. A piece takes
// about as long as it takes; amount is in units of ten minutes, capped so an hour-long
// symphony does not swamp a week of listening.
function portalActivity(w){
  try{
    const mins = Math.min(60, (w && w.mins) || 10);
    const k = "portal-activity", a = JSON.parse(localStorage.getItem(k)||"[]");
    a.push([Math.round(Date.now()/1000), "classical-journey", "listen", Math.max(0.5, mins/10)]);
    localStorage.setItem(k, JSON.stringify(a.slice(-2000)));
  }catch(e){}
}
const isHeard = id => rec(id).s>0;
const compHeard = c => (compWorks[c.id]||[]).some(w => isHeard(w.id));
const compDone = c => (compWorks[c.id]||[]).length>0 && compWorks[c.id].every(w => isHeard(w.id));
function streak(){
  const days = new Set();
  Object.values(ST.works).forEach(r => { if(r.h) days.add(new Date(r.h).toDateString()); });
  ST.log.forEach(e => days.add(new Date(e.ts).toDateString()));
  let n = 0; const d = new Date();
  if(!days.has(d.toDateString())) d.setDate(d.getDate()-1);
  while(days.has(d.toDateString())){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function exportState(){
  const json = JSON.stringify({v:3, exported:new Date().toISOString(), ...ST}, null, 1);
  if(DL){ DL.save({filename:"classical-journey-progress.json", data:json}).catch(()=>{}); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([json], {type:"application/json"}));
  a.download = "classical-journey-progress.json"; a.click(); URL.revokeObjectURL(a.href);
}
function importAny(o){
  if(!o || typeof o !== "object") throw new Error("not a progress file");
  mergeInto(ST, (o.v===3 || o.works) ? o : fromV2(o));
  save(); route();
}
$("#impfile").addEventListener("change", async ev => {
  const f = ev.target.files[0]; if(!f) return;
  try{ importAny(JSON.parse(await f.text())); }catch(e){ alert("That file could not be read as journey progress."); }
  ev.target.value = "";
});

/* ---------- sync: one JSON file in a folder Google Drive already syncs ---------- */
// Tachyread's model: write progress into a Drive-for-Desktop folder and let Drive move the
// file. No OAuth, no API key, no third-party service. We only merge what comes back.
let syncTimer = null, syncState = "idle", lastSync = 0, CLOUD = null, DL = null;
let pollTimer = null, seenStamp = 0, seenMtime = 0;
const SYNC_FILE = "classical-journey-progress.json";
const canSync = () => !!CLOUD || !!(BK.on && BK.h);
function setSyncChip(){
  const el = $("#sync"); if(!el) return;
  el.className = "";
  if(!canSync()){ el.textContent = BK.supported ? "this device only · sync & backup" : "this device · backup"; return; }
  const where = CLOUD ? " · claude.ai" : (BK.h ? " · " + BK.h.name : "");
  if(syncState==="busy"){ el.textContent = "syncing…"; el.className = "busy"; }
  else if(syncState==="err"){ el.textContent = "sync failed — tap to fix"; el.className = "err"; }
  else if(syncState==="dirty"){ el.textContent = "unsaved" + where; }
  else el.textContent = "synced ✓" + where;
}
function queueSync(){
  if(!canSync()) return;
  syncState = "dirty"; setSyncChip();
  clearTimeout(syncTimer); syncTimer = setTimeout(doSync, 4000);
}
// The canonical file IS the sync channel; the timestamped snapshots beside it are the backups.
async function syncWrite(){
  if(!BK.on || !BK.h) return;
  const fh = await BK.h.getFileHandle(SYNC_FILE, {create:true});
  const w = await fh.createWritable();
  await w.write(JSON.stringify({v:3, exported:new Date().toISOString(), ...ST}));
  await w.close();
  seenStamp = ST.updated;
  try{ seenMtime = (await fh.getFile()).lastModified; }catch(e){}
}
// Another device wrote through Drive: union-merge it in, so neither side loses a mark.
async function syncPull(){
  if(!BK.on || !BK.h) return false;
  try{
    const fh = await BK.h.getFileHandle(SYNC_FILE);
    const f = await fh.getFile();
    if(f.lastModified === seenMtime) return false;
    seenMtime = f.lastModified;
    const remote = JSON.parse(await f.text());
    if(!remote || typeof remote !== "object") return false;
    if((remote.updated||0) <= seenStamp) return false;
    const before = JSON.stringify([ST.works, ST.lessons, Math.round(ST.sec)]);
    mergeInto(ST, remote);
    seenStamp = Math.max(seenStamp, remote.updated||0);
    if(before === JSON.stringify([ST.works, ST.lessons, Math.round(ST.sec)])) return false;
    ST.updated = Date.now();
    try{ localStorage.setItem(SK, JSON.stringify(ST)); }catch(e){}
    route();            // the open view is now stale
    queueSync();        // push the merged result back so the other device converges
    return true;
  }catch(e){ return false; }   // no file yet, or permission gone — nothing to merge
}
function startPoll(){
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if(!document.hidden) syncPull(); }, 45000);
}
async function doSync(){
  clearTimeout(syncTimer);
  const ae = document.activeElement;
  if(ae && (ae.tagName==="TEXTAREA" || ae.tagName==="INPUT")){ syncTimer = setTimeout(doSync, 5000); return; }
  if(!canSync()){ syncState = "idle"; setSyncChip(); return; }
  syncState = "busy"; setSyncChip();
  try{
    if(CLOUD) await CLOUD.set(JSON.parse(JSON.stringify(ST)));
    else await syncWrite();
    syncState = "idle"; lastSync = Date.now();
  }catch(e){ syncState = "err"; syncTimer = setTimeout(doSync, 30000); }
  setSyncChip();
}
// Inside the claude.ai viewer there is no folder to reach, so progress lives in the artifact's
// own store instead — it survives a browser clear and follows the account.
async function initCloud(){
  if(!window.claude || !claude.use) return;
  const [db, dl] = await Promise.all([claude.use("db").catch(() => null), claude.use("downloads").catch(() => null)]);
  DL = dl;
  if(!db){ setSyncChip(); return; }
  try{
    CLOUD = db.doc("progress/main");
    const snap = await CLOUD.get();
    if(snap.exists){
      const remote = snap.data();
      mergeInto(ST, remote); if((remote.updated||0) > ST.updated) ST.updated = remote.updated;
      try{ localStorage.setItem(SK, JSON.stringify(ST)); }catch(e){}
      route();
    } else await CLOUD.set(JSON.parse(JSON.stringify(ST)));
    syncState = "idle"; lastSync = Date.now();
  }catch(e){ CLOUD = null; }
  setSyncChip();
}
if(SITE && "serviceWorker" in navigator && location.protocol==="https:") addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));

/* ---------- auto-backup to a folder (File System Access API) ---------- */
// Rolling JSON backups so a browser-data clear can't wipe progress; keeps newest BK.KEEP, older deleted.
const idb = {
  db(){ return new Promise((res,rej) => { const r = indexedDB.open("cj.bak",1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ const d = await this.db(); return new Promise((res,rej) => { const t = d.transaction("kv").objectStore("kv").get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); },
  async set(k,v){ const d = await this.db(); return new Promise((res,rej) => { const t = d.transaction("kv","readwrite").objectStore("kv").put(v,k); t.onsuccess = () => res(); t.onerror = () => rej(t.error); }); },
  async del(k){ const d = await this.db(); return new Promise((res,rej) => { const t = d.transaction("kv","readwrite").objectStore("kv").delete(k); t.onsuccess = () => res(); t.onerror = () => rej(t.error); }); }
};
const BK = {h:null, on:false, timer:null, last:+localStorage.getItem("cj.baklast")||0, err:"", KEEP:10, supported:"showDirectoryPicker" in window};
async function bkList(){ const names = []; for await(const n of BK.h.keys()) if(/^classical-journey-\d{4}-\d{2}-\d{2}-.*\.json$/.test(n)) names.push(n); return names.sort(); }
async function bkWrite(){
  if(!BK.on || !BK.h) return;
  clearTimeout(BK.timer); BK.timer = null;
  try{
    const stamp = new Date().toISOString().replace(/[:T]/g,"-").slice(0,19);
    const fh = await BK.h.getFileHandle("classical-journey-"+stamp+".json", {create:true});
    const w = await fh.createWritable(); await w.write(JSON.stringify({v:3, exported:new Date().toISOString(), ...ST})); await w.close();
    const names = await bkList();
    for(const n of names.slice(0, Math.max(0, names.length-BK.KEEP))) await BK.h.removeEntry(n).catch(()=>{});
    await syncWrite();
    BK.last = Date.now(); BK.err = ""; localStorage.setItem("cj.baklast", BK.last);
  }catch(e){ BK.err = e.name || "write failed"; }
  bkStatus();
}
function bkQueue(){ if(!BK.on) return; if(Date.now()-BK.last > 300000){ bkWrite(); return; } clearTimeout(BK.timer); BK.timer = setTimeout(bkWrite, 45000); }
async function bkPick(){ try{ BK.h = await showDirectoryPicker({id:"cjbak", mode:"readwrite"}); await idb.set("dir", BK.h); BK.on = true; await syncPull(); await bkWrite(); startPoll(); }catch(e){} bkStatus(); setSyncChip(); }
async function bkResume(){ if(!BK.h) return; try{ if(await BK.h.requestPermission({mode:"readwrite"})==="granted"){ BK.on = true; await bkMaybeRestore(); await syncPull(); bkWrite(); startPoll(); } }catch(e){ BK.err = e.name; } bkStatus(); }
async function bkOff(){ BK.on = false; BK.h = null; clearTimeout(BK.timer); clearInterval(pollTimer); await idb.del("dir").catch(()=>{}); bkStatus(); setSyncChip(); }
async function bkMaybeRestore(){
  if(Object.keys(ST.works).length || Object.keys(ST.lessons).length) return;
  try{
    const names = await bkList(); if(!names.length) return;
    const latest = names[names.length-1];
    if(confirm("Progress here is empty, but a backup exists ("+latest+"). Restore it?")){
      const f = await (await BK.h.getFileHandle(latest)).getFile(); importAny(JSON.parse(await f.text()));
    }
  }catch(e){}
}
function bkStatus(){ const d = $("#dlg"); if(d) toolsDialog(true); }
async function bkInit(){
  if(!BK.supported) return;
  try{ BK.h = await idb.get("dir"); }catch(e){}
  if(BK.h){ try{ if(await BK.h.queryPermission({mode:"readwrite"})==="granted"){ BK.on = true; await bkMaybeRestore(); await syncPull(); startPoll(); } }catch(e){} }
  setSyncChip();
}

/* ---------- paging: render a long list 60 at a time, more on scroll ---------- */
const LIM = {}, STEP = 60;
function pager(key, items, render){   // items: {h:headerHTML} | {w:item}; a header is emitted only with its first card
  const total = items.filter(x => x.w).length; let i = 0, n = 0;
  const take = max => { let s = "", h = ""; while(i < items.length && n < max){ const it = items[i++]; if(it.h){ h = it.h; continue; } s += h + render(it.w); h = ""; n++; } return s; };
  const html = take(Math.max(LIM[key]||0, STEP));
  const btn = () => n < total ? `<button class="pmore ui">Show more · ${(total-n).toLocaleString()} left</button>` : "";
  return { html, foot: `<div class="pmw">${btn()}</div>`, wire(box){
    const w = $(".pmw"); if(!w || !box) return;
    let io;
    const go = () => { if(io) io.disconnect(); box.insertAdjacentHTML("beforeend", take(n + STEP)); LIM[key] = n; w.innerHTML = btn(); hook(); };
    const hook = () => { const b = w && w.querySelector(".pmore"); if(!b) return; b.onclick = go;
      if("IntersectionObserver" in window){ io = new IntersectionObserver(es => { if(es.some(e => e.isIntersecting)) go(); }, {rootMargin:"800px"}); io.observe(b); } };
    hook(); } };
}

let F = null; try{ F = JSON.parse(sessionStorage.getItem("cj-filter")||"null"); }catch(e){}

const REGIONS = [...new Set(DB.works.map(w => w.region).filter(Boolean))].sort();

    && (!F.st || (F.st==="unheard" ? rec(w.id).s===0 : rec(w.id).s>=+F.st))
    && (!qq || clean(w.title+" "+cname(w)+" "+w.year+" "+(w.movement||"")+" "+(w.cat||"")+" "+(GENRES[w.genre]||"")+" "+(TRADITIONS[w.tradition]||"")).includes(qq));

/* ============ folder cowork ============
   The maker's shared panel (https://adervec.github.io/cowork.js) in fs mode: it drives a folder
   you pick, we write coach/request.json into it and show whatever an agent writes back to
   coach/reply.json. Every view rebuilds its DOM, so this re-mounts per render; the script is
   fetched once. */
function loadCowork(){
  if(window.cowork) return Promise.resolve(window.cowork);
  const head = document.head || document.documentElement;
  if(!head || typeof head.appendChild !== "function") return Promise.resolve(null);
  return new Promise(res => {
    try{
      const s = document.createElement("script");
      s.src = "https://adervec.github.io/cowork.js"; s.async = true;
      s.onload = () => res(window.cowork||null); s.onerror = () => res(null);
      head.appendChild(s);
    }catch(e){ res(null); }
  });
}
function coachHash(t){ let h = 5381; for(let i=0;i<t.length;i++) h = ((h*33)^t.charCodeAt(i))>>>0; return h.toString(16); }
const COACH_INSTRUCTIONS = [
  "# The Classical Journey - coach channel",
  "",
  "A listener is working chronologically through a catalogue of " + DB.works.length + " works by",
  DB.composers.length + " composers. Read `coach/request.json`:",
  "",
  "- `payload.totals` - heard, studied, loved, average rating, plays, hours streamed.",
  "- `payload.byEra` / `payload.byGenre` - heard and total in each.",
  "- `payload.loved` - the works rated highest: title, composer, year, era, genre.",
  "- `payload.recentlyPlayed` - what they actually put on lately, newest first.",
  "- `payload.notes` - their own notes, in their words.",
  "- `payload.unheardLandmarks` - major works they have not heard yet.",
  "- `payload.lessonsDone` / `payload.lessonsLeft` - the theory stops.",
  "",
  "Write `coach/reply.json`:",
  "",
  "```json",
  "{ \"requestHash\": \"<copy the request's requestHash verbatim>\",",
  "  \"reply\": \"<short markdown: what their taste is shaping up to be, the era or genre they",
  "  are plainly skirting, and three specific works to hear next with one sentence each on why -",
  "  and what to listen for in each. Curious and concrete, never a lecture.>\" }",
  "```",
  "",
  "Recommend only works that appear in the payload's own lists."
].join("\n");
function mountCoach(){
  const host = document.getElementById("coachHost"), out = document.getElementById("coachReply");
  if(!host || host.childElementCount) return;
  const show = t => { out.textContent = t||""; out.style.display = t ? "block" : "none"; };
  try{ show(localStorage.getItem("cj-coach-reply")||""); }catch(e){}
  loadCowork().then(cw => {
    if(!cw || host.childElementCount) return;
    cw.mount(host, {
      app:"classical-journey",
      manifest:{protocol:"cowork-manifest", protocolVersion:1, app:"classical-journey",
        channels:[{name:"coach", request:["coach/request.json"],
                   instructions:"coach/INSTRUCTIONS.md", replyPath:"coach/reply.json"}]},
      files:()=>{
        const all = chrono, mark = w => rec(w.id);
        const tally = ws => ({heard:ws.filter(w=>mark(w).s>0).length, total:ws.length});
        const brief = w => ({title:w.title, composer:cname(w), year:w.year, era:w.era, genre:w.genre});
        const rated = Object.entries(ST.works).filter(([,r])=>r.r>0)
          .sort((a,b)=>b[1].r-a[1].r).slice(0,20);
        const genres = [...new Set(all.map(w=>w.genre).filter(Boolean))];
        const payload = {
          totals:{works:all.length, heard:all.filter(w=>mark(w).s>0).length,
                  studied:all.filter(w=>mark(w).s>1).length,
                  loved:all.filter(w=>mark(w).s>2).length,
                  plays:Object.values(ST.works).reduce((a,r)=>a+(r.p||0),0),
                  hoursStreamed:Math.round((ST.sec||0)/360)/10},
          byEra:Object.fromEntries(DB.eras.map(e=>[e.name, tally(all.filter(w=>w.era===e.id))])),
          byGenre:Object.fromEntries(genres.map(g=>[g, tally(all.filter(w=>w.genre===g))])),
          loved:rated.map(([id,r])=>byId[id]?Object.assign(brief(byId[id]),{rating:r.r}):null).filter(Boolean),
          recentlyPlayed:(ST.log||[]).slice(-25).reverse()
            .map(e=>byId[e.id]?{title:byId[e.id].title, composer:cname(byId[e.id])}:null).filter(Boolean),

/* ============ the constellation ============
   radius = chronology (earliest at the core), angle = region, and within each region a
   contiguous band per movement, so a school reads as one constellation. Edges are pre/succ lineage. */
let TREE = null, treeTeardown = null;
function buildTree(){
  if(TREE) return TREE;
  const R0 = 70, R1 = 1000;
  const list = chrono.filter(w => !w.thin && w.region);
  const rank = new Map(); list.forEach((w,i) => rank.set(w.id, i));
  const n = list.length || 1;
  const radiusOf = w => R0 + (R1-R0)*((rank.get(w.id)+.5)/n);
  const byRegion = new Map();
  for(const w of list){ const r = w.region; if(!byRegion.has(r)) byRegion.set(r, []); byRegion.get(r).push(w); }
  const regions = [...byRegion.entries()].sort((a,b) => b[1].length-a[1].length);
  const wt = c => Math.sqrt(c);
  const total = regions.reduce((s,[,ws]) => s+wt(ws.length), 0) || 1;
  const GAP = 0.018;
  const nodes = [], sectors = [];
  let ang = -Math.PI/2;
  const GEN = Object.keys(GENRES);
  for(const [reg, ws] of regions){
    const span = (Math.PI*2)*(wt(ws.length)/total) - GAP;
    const movs = new Map();
    for(const w of ws){ const m = w.movement||"—"; if(!movs.has(m)) movs.set(m, []); movs.get(m).push(w); }
    // angle must not track time or the sector collapses into a spiral: order movements by genre
    const bands = [...movs.entries()].map(([m,l]) => { l.sort((a,b) => a.sortYear-b.sortYear); const t = {}; for(const w of l) t[w.genre] = (t[w.genre]||0)+1;
      const dom = Object.entries(t).sort((a,b) => b[1]-a[1])[0][0]; return {m, list:l, med:l[Math.floor(l.length/2)].sortYear, gi:GEN.indexOf(dom)}; }).sort((a,b) => a.gi-b.gi || a.med-b.med);
    sectors.push({reg, a0:ang, a1:ang+span, n:ws.length});
    let a = ang; const GOLD = 2.399963229728653;
    const bTot = bands.reduce((s,b) => s+wt(b.list.length), 0) || 1;
    for(const b of bands){
      const bs = span*(wt(b.list.length)/bTot);
      const ca = a+bs/2, cr = radiusOf(b.list[Math.floor(b.list.length/2)]);
      const cx = Math.cos(ca)*cr, cy = Math.sin(ca)*cr;
      const room = Math.max(7, Math.min(bs*cr*0.46, 46));
      const spread = Math.min(room, 5+3.4*Math.sqrt(b.list.length));
      b.list.forEach((w,i) => { const rr = spread*Math.sqrt((i+.5)/b.list.length), aa = i*GOLD; nodes.push({w, id:w.id, x:cx+Math.cos(aa)*rr, y:cy+Math.sin(aa)*rr, reg, mov:b.m}); });
      a += bs;
    }
    ang += span+GAP;
  }
  const pos = new Map(nodes.map(o => [o.id, o]));
  const edges = [];
  for(const o of nodes){ const L = o.w.links||{};
    for(const id of (L.succ||[])){ const p = pos.get(id); if(p) edges.push(o.x,o.y,p.x,p.y); }
    for(const id of (L.pre||[])){ const p = pos.get(id); if(p) edges.push(p.x,p.y,o.x,o.y); } }
  const rings = ERAS.map(e => { const ws = list.filter(w => w.era===e.id); return ws.length ? {label:e.name, r:radiusOf(ws[ws.length-1])} : null; }).filter(Boolean);
  TREE = {nodes, edges:new Float32Array(edges), pos, sectors, rings, R1};
  return TREE;
}
function treeView(){
  const T = buildTree();
  const inner = `<div id="treewrap">
    <canvas id="tree"></canvas>
    <div class="tctl ui"><input type="search" id="tsearch" placeholder="Find in the constellation…"><button class="chip" id="tfit">Reset view</button><button class="chip" id="tunseen">Dim heard</button></div>
    <div class="tkey ui"><b>${T.nodes.length.toLocaleString()} works</b> — the core is the oldest, the rim is today; each arc is a region, each cluster a movement. Lines are lineage: what led to what.<br>
      <i style="background:var(--star)"></i>loved <i style="background:var(--gold)"></i>studied <i style="background:var(--blue)"></i>heard <i style="background:var(--mut);opacity:.5"></i>not yet</div>
    <div id="ttip"><div class="tt"></div><div class="ts"></div></div></div>`;
  app.innerHTML = shellHTML("tree", inner); afterRender();
  const cv = $("#tree"), ctx = cv.getContext("2d"), tip = $("#ttip"), wrap = $("#treewrap");
  const css = getComputedStyle(document.body), C = k => css.getPropertyValue(k).trim();
  let V = {x:0,y:0,k:1}, hot = null, hits = null, dimSeen = false;
  function fit(){ const w = wrap.clientWidth, h = wrap.clientHeight; V.k = Math.min(w,h)/(T.R1*2.55); V.x = w/2; V.y = h/2; }
  function resize(){ const dpr = Math.min(devicePixelRatio||1, 2); cv.width = wrap.clientWidth*dpr; cv.height = wrap.clientHeight*dpr; cv.style.width = wrap.clientWidth+"px"; cv.style.height = wrap.clientHeight+"px"; ctx.setTransform(dpr,0,0,dpr,0,0); draw(); }
  const toScreen = o => ({x:o.x*V.k+V.x, y:o.y*V.k+V.y});
  function colorFor(o){ const r = rec(o.id); if(hits) return hits.has(o.id) ? C("--ink") : C("--mut"); if(dimSeen && r.s>0) return C("--mut"); return r.s>2 ? C("--star") : r.s===2 ? C("--gold") : r.s===1 ? C("--blue") : C("--mut"); }
  function draw(){
    const w = wrap.clientWidth, h = wrap.clientHeight;
    ctx.clearRect(0,0,w,h); ctx.fillStyle = C("--ground"); ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = C("--line"); ctx.globalAlpha = .55; ctx.lineWidth = 1;
    for(const g of T.rings){ ctx.beginPath(); ctx.arc(V.x, V.y, g.r*V.k, 0, Math.PI*2); ctx.stroke(); }
    ctx.globalAlpha = 1;
    if(V.k>0.12){ ctx.fillStyle = C("--mut"); ctx.font = "500 11px 'Segoe UI', system-ui, sans-serif"; ctx.textAlign = "center"; let lastY = Infinity;
      for(const g of T.rings){ const y = V.y-g.r*V.k-4; if(lastY-y<15) continue; ctx.fillText(g.label, V.x, y); lastY = y; } }
    const E = T.edges; ctx.strokeStyle = C("--gold"); ctx.globalAlpha = Math.min(.12, .015+V.k*.09); ctx.lineWidth = 1; ctx.beginPath();
    for(let i=0;i<E.length;i+=4){ ctx.moveTo(E[i]*V.k+V.x, E[i+1]*V.k+V.y); ctx.lineTo(E[i+2]*V.k+V.x, E[i+3]*V.k+V.y); }
    ctx.stroke(); ctx.globalAlpha = 1;
    const groups = new Map();
    for(const o of T.nodes){ const c = colorFor(o); if(!groups.has(c)) groups.set(c, []); groups.get(c).push(o); }
    const order = [C("--mut"), C("--blue"), C("--gold"), C("--star"), C("--ink")];
    for(const c of [...groups.keys()].sort((a,b) => order.indexOf(a)-order.indexOf(b))){
      ctx.fillStyle = c; ctx.globalAlpha = (c===C("--mut")) ? (hits ? .16 : .5) : 1; ctx.beginPath();
      for(const o of groups.get(c)){ const s = toScreen(o); if(s.x<-20||s.y<-20||s.x>w+20||s.y>h+20) continue;
        const boost = (hits && hits.has(o.id)) ? 1.9 : 1;
        const rr = Math.max(1, boost*(o.w.sig===3 ? 3.6 : o.w.sig===2 ? 2.3 : 1.5)*Math.max(.5, Math.min(2.2, V.k*3.2)));
        ctx.moveTo(s.x+rr, s.y); ctx.arc(s.x, s.y, rr, 0, Math.PI*2); }
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if(V.k>0.10){ ctx.fillStyle = C("--mut"); ctx.font = "700 11px 'Segoe UI', system-ui, sans-serif";
      for(const s of T.sectors){ const mid = (s.a0+s.a1)/2, rr = (T.R1+52)*V.k; const x = V.x+Math.cos(mid)*rr, y = V.y+Math.sin(mid)*rr;
        ctx.textAlign = Math.cos(mid)>.2 ? "left" : Math.cos(mid)<-.2 ? "right" : "center"; ctx.fillText(s.reg.toUpperCase(), x, y); } }
    if(hot){ const L = hot.w.links||{}; const rel = [...(L.pre||[]),...(L.succ||[]),...(L.sim||[]),...(L.con||[])];
      ctx.strokeStyle = C("--gold"); ctx.lineWidth = 1.4; ctx.globalAlpha = .9; ctx.beginPath(); const hs = toScreen(hot);
      for(const id of rel){ const p = T.pos.get(id); if(!p) continue; const ps = toScreen(p); ctx.moveTo(hs.x,hs.y); ctx.lineTo(ps.x,ps.y); }
      ctx.stroke(); ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(hs.x,hs.y,7,0,Math.PI*2); ctx.strokeStyle = C("--ink"); ctx.lineWidth = 2; ctx.stroke(); }
  }
  function pick(px,py){ let best = null, bd = 18*18; for(const o of T.nodes){ const s = toScreen(o), dx = s.x-px, dy = s.y-py, d = dx*dx+dy*dy; if(d<bd){ bd = d; best = o; } } return best; }
  let drag = null;
  cv.addEventListener("pointerdown", e => { drag = {x:e.clientX,y:e.clientY,vx:V.x,vy:V.y,moved:false}; cv.setPointerCapture(e.pointerId); cv.classList.add("drag"); });
  cv.addEventListener("pointermove", e => {
    const r = cv.getBoundingClientRect(), px = e.clientX-r.left, py = e.clientY-r.top;
    if(drag){ const dx = e.clientX-drag.x, dy = e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>3) drag.moved = true; V.x = drag.vx+dx; V.y = drag.vy+dy; draw(); return; }
    const o = pick(px,py);
    if(o!==hot){ hot = o; draw();
      if(o){ tip.style.display = "block"; tip.querySelector(".tt").textContent = o.w.title;
        tip.querySelector(".ts").textContent = [cname(o.w), o.w.year, o.mov!=="—" ? o.mov : ""].filter(Boolean).join(" · ");
        const tw = tip.offsetWidth, th = tip.offsetHeight;
        tip.style.left = Math.min(Math.max(4,px+14), wrap.clientWidth-tw-4)+"px"; tip.style.top = Math.min(Math.max(4,py+14), wrap.clientHeight-th-4)+"px"; }
      else tip.style.display = "none"; }
  });
  const endDrag = e => { if(drag && !drag.moved){ const r = cv.getBoundingClientRect(); const o = pick(e.clientX-r.left, e.clientY-r.top); if(o) location.hash = "#/w/"+o.id; } drag = null; cv.classList.remove("drag"); };
  cv.addEventListener("pointerup", endDrag);
  cv.addEventListener("pointercancel", () => { drag = null; cv.classList.remove("drag"); });
  cv.addEventListener("pointerleave", () => { hot = null; tip.style.display = "none"; draw(); });
  cv.addEventListener("wheel", e => { e.preventDefault(); const r = cv.getBoundingClientRect(), px = e.clientX-r.left, py = e.clientY-r.top;
    const f = Math.exp(-e.deltaY*0.0016), k2 = Math.max(0.04, Math.min(6, V.k*f)); V.x = px-(px-V.x)*(k2/V.k); V.y = py-(py-V.y)*(k2/V.k); V.k = k2; draw(); }, {passive:false});
  $("#tfit").onclick = () => { fit(); draw(); };
  $("#tunseen").onclick = e => { dimSeen = !dimSeen; e.target.classList.toggle("on", dimSeen); e.target.textContent = dimSeen ? "Show heard" : "Dim heard"; draw(); };
  const ts = $("#tsearch"); let st;
  ts.oninput = () => { clearTimeout(st); st = setTimeout(() => { const qq = clean(ts.value); hits = qq ? new Set(T.nodes.filter(o => clean(o.w.title+" "+cname(o.w)+" "+(o.mov||"")+" "+(o.w.region||"")).includes(qq)).map(o => o.id)) : null; draw(); }, 200); };
  fit(); resize();
  const onR = () => resize(); window.addEventListener("resize", onR);
  treeTeardown = () => window.removeEventListener("resize", onR);
}

async function iaQuery(qs, fulltext){

function pickDoc(docs, qs){
  const toks = clean(qs).split(" ").filter(t => t.length>2 || /^\d+$/.test(t)); if(!toks.length) return null;
  let best = null, bs = 0;
  for(const d of docs){ const t = clean(d.identifier+" "+(d.title||"")); let hit = 0; toks.forEach(k => { if(t.includes(k)) hit++; });
    const s = hit/toks.length + Math.min(d.downloads||0, 50000)/1e6; if(s>bs){ bs = s; best = d; } }
  return bs>=0.55 ? best : null;
}
async function iaItem(id){
  const m = await (await fetch("https://archive.org/metadata/"+id)).json();
  let fs = (m.files||[]).filter(f => /\.mp3$/i.test(f.name));
  if(!fs.length) fs = (m.files||[]).filter(f => /\.(ogg|m4a|flac)$/i.test(f.name));
  const names = new Set(fs.map(f => f.name));
  fs = fs.filter(f => !/(_64kb|_vbr)\.mp3$/i.test(f.name) || !names.has(f.name.replace(/_(64kb|vbr)\.mp3$/i, ".mp3")));
  fs.sort((a,b) => (parseInt(a.track)||999)-(parseInt(b.track)||999) || a.name.localeCompare(b.name));
  if(!fs.length) return null;
  // archive.org/download redirects round-robin across nodes and some are dead — direct URLs to known-workable servers first
  const dir = m.dir||"/0/items/"+id, servers = (m.workable_servers||[]).slice(0,2);
  return {id, title:(m.metadata && m.metadata.title)||id, tracks:fs.map(f => { const e = encodeURIComponent(f.name); const urls = servers.map(s => "https://"+s+dir+"/"+e); urls.push("https://archive.org/download/"+id+"/"+e);
    return {urls, name:(f.title||f.name.replace(/\.[^.]+$/, "").replace(/[_\-]+/g, " ")).trim()}; })};
}
async function resolveWork(w){
  if(IACACHE[w.id]){ const it = await iaItem(IACACHE[w.id]); if(it) return it; delete IACACHE[w.id]; }
  const c = w.composer && comp[w.composer], ln = c ? lastName(c) : (w.culture||"");
  const full = clean(ln+" "+w.title), main = clean(ln+" "+w.title.split(":")[0]);
  let docs = await iaQuery(main, false);
  let d = pickDoc(docs, full) || pickDoc(docs, main);
  if(!d){ docs = await iaQuery(main, true); d = pickDoc(docs, main); }
  if(!d) return null;
  const it = await iaItem(d.identifier);
  if(it){ IACACHE[w.id] = d.identifier; try{ localStorage.setItem("cj.ia", JSON.stringify(IACACHE)); }catch(e){} }
  return it;
}
function dockShow(){ $("#dock").hidden = false; document.body.classList.add("playing"); }
function setMediaSession(w, tn){
  if(!("mediaSession" in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({title:tn||w.title, artist:cname(w), album:"The Classical Journey"});
  navigator.mediaSession.setActionHandler("play", () => P.audio.play()); navigator.mediaSession.setActionHandler("pause", () => P.audio.pause());
  navigator.mediaSession.setActionHandler("previoustrack", prevTrack); navigator.mediaSession.setActionHandler("nexttrack", nextTrack);
}
function trySrc(t){
  clearTimeout(P.watch);
  if(P.srcIdx>=t.urls.length){ status("Stream stalled — use the links above"+(P.qi<P.queue.length-1 ? "; skipping ahead…" : ".")); if(P.qi<P.queue.length-1) setTimeout(nextQueue, 1600); return; }
  P.audio.src = t.urls[P.srcIdx]; P.audio.play().catch(()=>{});
  P.watch = setTimeout(() => { if(P.audio.readyState<2){ P.srcIdx++; trySrc(t); } }, 12000);
}
function loadTrack(k){
  if(k<0 || k>=P.tracks.length) return;
  P.ti = k; P.lt = null;
  const t = P.tracks[k], w = P.cur.w;
  P.curTrack = t; P.srcIdx = 0; trySrc(t);
  $("#d-title").innerHTML = `<a href="#/w/${w.id}">${esc(w.title)}</a>`+(P.tracks.length>1 ? esc(" — "+t.name) : "");
  $("#d-sub").textContent = cname(w)+" · "+P.cur.itemTitle+(P.tracks.length>1 ? ` · track ${k+1}/${P.tracks.length}` : "");
  document.querySelectorAll("#d-list li").forEach((li,n) => li.classList.toggle("on", n===k));
  setMediaSession(w, P.tracks.length>1 ? w.title+" — "+t.name : w.title);
}
function prevTrack(){ if(P.audio.currentTime>4 || P.ti===0) P.audio.currentTime = 0; else loadTrack(P.ti-1); }
function nextTrack(){ if(!P.stopAfter && P.ti<P.tracks.length-1) loadTrack(P.ti+1); else nextQueue(); }
function nextQueue(){ if(P.qi<P.queue.length-1){ P.qi++; loadWork(P.queue[P.qi]); } else status("End of the queue — pick another stop on the timeline."); }
function popListen(url){   // one named, reused window so the music keeps going while the catalogue is browsed
  const pw = window.open(url, "cj-listen", "popup,width=560,height=720");
  if(pw) pw.focus(); else window.open(url, "_blank", "noopener");
}
async function loadWork(id){
  const w = byId[id]; if(!w) return;
  dockShow();
  P.cur = {w, itemTitle:""}; P.tracks = []; P.ti = -1; P.stopAfter = false;
  $("#d-title").innerHTML = `<a href="#/w/${w.id}">${esc(w.title)}</a>`;
  $("#d-sub").textContent = cname(w)+" · finding a recording…";
  $("#d-yt").href = LINKS(w)[0][1];
  $("#d-yt").onclick = e => { e.preventDefault(); P.audio.pause(); popListen(LINKS(w)[0][1]); };
  $("#d-tracks").hidden = true; status("");
  try{
    const it = await resolveWork(w);
    if(!it){   // no free stream: offer a pop-up on YouTube / Spotify (needs the click — browsers block unprompted pop-ups)
      $("#d-sub").textContent = cname(w);
      const more = P.qi<P.queue.length-1, L = LINKS(w), st = $("#d-status");
      st.hidden = false;
      st.innerHTML = `No free stream for this one. <button class="obtn" data-pop="0">▶ YouTube pop-up</button> <button class="obtn" data-pop="1">▶ Spotify pop-up</button>${more ? ` <span id="d-skip">· skipping ahead in 10 s</span>` : ""}`;
      const sk = more ? setTimeout(nextQueue, 10000) : 0;
      st.querySelectorAll("[data-pop]").forEach(b => b.onclick = () => { clearTimeout(sk); popListen(L[+b.dataset.pop][1]); markHeard(id); refreshChip(id); refreshTracker(id);
        status("Playing in the pop-up window — it stays open while you browse; the next pop-up reuses it."); });
      return; }
    P.cur.itemTitle = it.title; P.tracks = it.tracks;
    markHeard(id); refreshChip(id); refreshTracker(id);
    if(it.tracks.length>1){ $("#d-tracks").hidden = false; $("#d-list").innerHTML = it.tracks.map(t => `<li>${esc(t.name)}</li>`).join(""); }
    // start at the track that best matches the work; in big compilations play only that track
    const toks = clean(w.title).split(" ").filter(t => t.length>2 || /^\d+$/.test(t));
    let bi = 0, bs = 0;
    it.tracks.forEach((t,k) => { const tn = clean(t.name); let hit = 0; toks.forEach(x => { if(tn.includes(x)) hit++; }); const sc = toks.length ? hit/toks.length : 0; if(sc>bs){ bs = sc; bi = k; } });
    P.stopAfter = bs>=0.4 && it.tracks.length>6;
    loadTrack(bs>=0.4 ? bi : 0);
  }catch(e){ status("Couldn't reach the Internet Archive from here — use the links on the work's page to listen."); $("#d-sub").textContent = cname(w); }
}
function playQueue(list, start){ P.queue = list; P.qi = start; loadWork(P.queue[P.qi]); }
P.audio.addEventListener("playing", () => { clearTimeout(P.watch); status(""); $("#d-play").textContent = "⏸"; });
P.audio.addEventListener("loadeddata", () => clearTimeout(P.watch));
P.audio.addEventListener("pause", () => { $("#d-play").textContent = "▶"; });
P.audio.addEventListener("ended", nextTrack);
P.audio.addEventListener("error", () => { if(P.curTrack){ P.srcIdx++; trySrc(P.curTrack); } });
P.audio.addEventListener("loadedmetadata", () => { $("#d-dur").textContent = fmt(P.audio.duration); });
let seeking = false;
P.audio.addEventListener("timeupdate", () => {
  const t = P.audio.currentTime, d = P.audio.duration||1;
  $("#d-cur").textContent = fmt(t); if(!seeking) $("#d-seek").value = 1000*t/d;
  if(!P.audio.paused && P.lt!=null){ const dd = t-P.lt; if(dd>0 && dd<2){ ST.sec += dd; P.dirty = true; } }
  P.lt = t;
});
setInterval(() => { if(P.dirty){ save(); P.dirty = false; } }, 8000);
$("#d-seek").addEventListener("input", () => { seeking = true; });
$("#d-seek").addEventListener("change", e => { seeking = false; P.audio.currentTime = e.target.value/1000*(P.audio.duration||0); P.lt = P.audio.currentTime; });
$("#d-vol").addEventListener("input", e => P.audio.volume = e.target.value);
$("#d-play").addEventListener("click", () => { P.audio.paused ? P.audio.play().catch(()=>{}) : P.audio.pause(); });
$("#d-prev").addEventListener("click", prevTrack);
$("#d-next").addEventListener("click", nextTrack);
$("#d-close").addEventListener("click", () => { P.audio.pause(); $("#dock").hidden = true; document.body.classList.remove("playing"); });
$("#d-list").addEventListener("click", e => { const li = e.target.closest("li"); if(li) loadTrack([...li.parentNode.children].indexOf(li)); });

/* ---------- delegated clicks: play, radio, listen links, lessons, expanders ---------- */
document.addEventListener("click", ev => {
  const play = ev.target.closest("[data-play]");
  if(play){ ev.preventDefault(); playQueue([play.dataset.play], 0); return; }
  const radio = ev.target.closest("[data-radio]");
  if(radio){ const cid = radio.dataset.radio;
    if(radio.dataset.only){ playQueue((compWorks[cid]||[]).map(w => w.id), 0); return; }
    const all = journey.map(w => w.id); const s = all.findIndex(id => byId[id].composer===cid); playQueue(all, s<0 ? 0 : s); return; }
  const listen = ev.target.closest("[data-listen]");
  if(listen){ const id = listen.dataset.listen; markHeard(id); refreshChip(id); refreshTracker(id); return; }
  const more = ev.target.closest(".more");
  if(more){ const card = more.closest(".comp"); card.classList.toggle("expanded"); const n = card.querySelectorAll(".work").length-6; more.textContent = card.classList.contains("expanded") ? "Show fewer" : `+${n} more`; return; }
  const ld = ev.target.closest(".l-done");
  if(ld){ const box = ld.closest(".lesson"), t = box.dataset.l;
    (t in ST.lessons) ? delete ST.lessons[t] : ST.lessons[t] = Date.now(); save();
    box.classList.toggle("done", t in ST.lessons); ld.textContent = (t in ST.lessons) ? "✓ Learned" : "Mark as learned";
    const js = $("#jstats"); if(js) journeyStats(); return; }
});
function journeyStats(){
  const js = $("#jstats"); if(!js) return;
  const nW = chrono.filter(w => isHeard(w.id)).length;
  js.innerHTML = `<b>${DB.composers.filter(compHeard).length}</b>/<b>${DB.composers.length}</b> composers · <b>${nW}</b>/<b>${journey.length}</b> works · <b>${Object.keys(ST.lessons).length}</b>/<b>${DB.lessons.length}</b> theory stops · <b>${fmtH(ST.sec)}</b> listened`;
  const f = document.querySelector("#jbar .pfill i"); if(f) f.style.width = (100*nW/chrono.length)+"%";
}

/* ---------- router ---------- */
const SCROLL = {}; let lastHash = null;
function route(){
  const h = location.hash||"#/";
  if(lastHash && lastHash!==h) SCROLL[lastHash] = scrollY;
  const dlg = $("#dlg"); if(dlg) dlg.remove();
  if(treeTeardown){ treeTeardown(); treeTeardown = null; }
  let m;
  if((m = h.match(/^#\/w\/(.+)$/))) workView(decodeURIComponent(m[1]));
  else if((m = h.match(/^#\/c\/(.+)$/))) composerView(decodeURIComponent(m[1]));
  else if(h==="#/works") worksView();
  else if(h==="#/composers") composersView();
  else if(h==="#/theory") theoryView();
  else if(h==="#/progress") progressView();
  else if(h==="#/tree") treeView();
  else if(h==="#/table") tableView();
  else if(h==="#/about") aboutView();
  else if(h==="#/more") moreView();
  else journeyView();
  const back = lastHash!==h && SCROLL[h]!==undefined && (h==="#/" || h==="#/works" || h==="#/composers" || h==="#/theory");
  lastHash = h;
  if(h!=="#/tree") requestAnimationFrame(() => scrollTo(0, back ? SCROLL[h] : 0));
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e => {
  if(e.target.tagName==="TEXTAREA" || e.target.tagName==="INPUT") return;
  if(e.key==="Escape"){ const d = $("#dlg"); if(d) d.remove(); return; }
  const m = location.hash.match(/^#\/w\/(.+)$/); if(!m) return;
  const i = chrono.indexOf(byId[decodeURIComponent(m[1])]);
  if(e.key==="ArrowLeft" && chrono[i-1]) location.hash = "#/w/"+chrono[i-1].id;
  if(e.key==="ArrowRight" && chrono[i+1]) location.hash = "#/w/"+chrono[i+1].id;
});
route();
// Let the maker's app portal know (same-origin localStorage) that this app is installed.
try{
  const DM = ["standalone","minimal-ui","fullscreen","window-controls-overlay"];
  if(navigator.standalone || DM.some(m => matchMedia("(display-mode: "+m+")").matches)){
    const k = "portal-installed", reg = JSON.parse(localStorage.getItem(k)||"{}");
    reg["classical-journey"] = Date.now();
    localStorage.setItem(k, JSON.stringify(reg));
  }
}catch(e){}
bkInit();
initCloud();
</script>
